                    fuente: "modo EOD: la salida de suelo se coloca al DLL COMPLETO. fsuelo escala esa distancia; 1.0 = DLL entero. Entra en ndn = DLL*fsuelo/pv (norma R-2.5). Motor: pipeline3.py, parametro fsuelo.",
                    fecha: "2026-08-17"}
  kcap:            {valor: 40,     unidad: contratos, tipo: DADO,
                    fuente: "tope duro de contratos por sesion (limite operativo y de la plataforma)", fecha: "2026-08-17"}
  # AVISO CRITICO: b (el buffer) NO es un colchon de seguridad. Es el DIAL DE SALA
  # DIARIA: ndn = DLL/(5k) y k ~ m*Mm/(s0+b)  ==>  ndn proporcional a (s0+b)/Mm.
  # Soltarlo los dias en que la muerte es "imposible" parece gratis y es RUINOSO:
