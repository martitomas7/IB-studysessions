hedge_broker:
  instrumento:     "MES (Micro E-mini S&P 500)"
  valor_punto_usd: {valor: 5.0,   unidad: USD/punto/micro, tipo: DADO, fuente: "especificacion del contrato CME MES", fecha: "2026-08-17"}
  tick_usd:        {valor: 1.25,  unidad: USD/tick/micro,  tipo: DADO, fuente: "0,25 pts x 5 USD", fecha: "2026-08-17"}
  comision_rt_usd: {valor: 1.60,  unidad: USD/micro/round-trip, tipo: DADO, fuente: "tarifa NinjaTrader/AMP aportada por el operador", fecha: "2026-08-18"}
  spr_usd:         {valor: 3.0,   unidad: USD/micro/round-trip, tipo: SUPUESTO,
                    formula: "comision_rt_usd + tick_usd = 1,60 + 1,25 = 2,85 -> redondeado a 3,00",
                    ojo: "LEER ENTERO ANTES DE USAR EL NUMERO. SPR es la FRICCION TOTAL por micro y round trip que entra en la identidad de cobertura (parametro SPR del motor). Los 2,85 suponen UN SOLO cruce de horquilla para el round trip ENTERO, o sea media horquilla por pata. Si cada pata cruza la suya, el valor fisico es ~4,10. Por tanto 3,00 NO es conservador: es el EXTREMO OPTIMISTA de un rango cuyo centro esta en ~4,10. Es, junto con slip_usd_micro, uno de los dos numeros que NADIE HA MEDIDO, y el que mas riesgo mueve por unidad de error.",
                    coste_si_falla: "estres_v10.json: SPR4_pesimista 1.112,3 (-86,2 · P 2,72 %) · SPR41_un_cruce_por_pata 1.094,6 (-103,9 · P 3,00 %) · SPR5 985,6 (-212,9 · P 7,65 %) · SPR6 858,4 (-340,1 · P 14,43 %). ES LA VARIABLE QUE DECIDE LA PUERTA F3.1: el criterio pre-registrado P(degradar) <= 5 % se rompe entre 4,50 (4,69 %) y 4,75 (5,12 %). Barrido fino en cifras_citadas.json:puerta_f31.",
                    fecha: "2026-08-18"}
  slip_usd_micro:  {valor: 2.5,   unidad: USD/micro/muerte, tipo: SUPUESTO,
                    fuente: "ADOPTADO, NUNCA MEDIDO. Es uno de los DOS numeros que el modelo no tiene (el otro es spr_usd); la Fase 3.1 de 05_ORDEN existe precisamente para medirlo. Bandas: VERDE 2,50 · AMBAR 6,25 · ROJO 12,50.",
                    ojo: "LA UNIDAD ES POR MICRO, NO POR MUERTE. El deslizamiento por muerte es slip_usd_micro * m, y m vale 2 en la evaluacion y 4 en la fondeada. O sea: 25 $/muerte medidos en una EVAL son 12,50 $/micro = banda ROJA; medidos en una FONDEADA son 6,25 = banda AMBAR. Anota siempre el valor por micro y con que m operaba la cuenta.",
                    coste_si_falla: "estres_v10.json: desliz_ambar_25 -> 1.082,5 $/mes (-116,0 · P 1,32 %) · desliz_rojo_50 -> 884,9 $/mes (-313,6 · P 1,38 %). El coste es LINEAL: slip x muertes. Apenas mueve el riesgo; el que lo mueve es spr_usd.",
                    fecha: "2026-08-18"}
  desviacion_fill_normal_usd_tick: {valor: 0.0, unidad: USD/tick/micro/fill-normal, tipo: SUPUESTO,
                    fuente: "NO ADOPTADO -- eje de barrido, no un valor de operacion. CORREGIDO (REVISION_D8_S5_PASADA2.md §2, 21-08-2026): esto NO es un tercer numero independiente -- es spr_usd (arriba) EXPRESADO en otra unidad. spr_usd ya cubre 'cruzar la horquilla' para TODO micro-round-trip (muerte o no); este eje mide la MISMA desviacion de horquilla, pero por fill normal (entrada/objetivo/campana) en vez de por round-trip fijo, y por el mismo canal (resta de caja_delta, jamas toca bal). Factor de conversion medido directo del pack de 504 dias (verificacion_R3, censo independiente): de 2.742 micro-sesiones totales, 2.068 son sin muerte (fraccion 0,7542) -- 1 tick de este eje equivale a Delta spr_usd = 2.585/2.742 = 0,9427 $/micro.",
                    ojo: "REGLA DE NO DOBLE COBRO (misma logica que slip_usd_micro/ruido_muerte en la Pasada 2): spr_usd y este eje NUNCA suben los dos a la vez -- mientras spr_usd siga cargando la friccion (como hoy), este eje se queda en 0,0. Si alguna vez se prefiere expresar la friccion medida en ticks de fill en vez de en $/round-trip, se sube ESTE eje Y SE BAJA spr_usd en la cantidad equivalente (factor 0,9427 $/micro por tick), nunca los dos juntos. F3.1 NO necesita medir dos ejes con bandas separadas: mide UNA desviacion real de fill (en ticks) y se convierte a $/micro round-trip con este factor para entrar en la tabla de la puerta F3.1 que ya existe (05_ORDEN_DE_CONSTRUCCION.md) -- no hacen falta bandas nuevas.",
                    coste_si_falla: "verificacion_R3/PASADA_2_RUIDO.md, barrido de fills normales sobre los 504 dias del pack: -2.585,00 $/tick, LINEAL exacta tramo a tramo (aislado de eval.bal/funded.bal -- confirmado bit a bit dia a dia, nunca contamina pool/relevo/sizing). Convertido a spr_usd equivalente vale lo mismo que subir la friccion -- ver la tabla de la puerta F3.1 (05_ORDEN_DE_CONSTRUCCION.md) para el criterio de paso. valor=0.0 significa que HOY no se asume ningun coste por este eje en produccion (lo carga spr_usd).",
                    fecha: "2026-08-21 (revisado, ver REVISION_D8_S5_PASADA2.md §2)"}
  margen_intradia_usd: {valor: 40.0, unidad: USD/micro, tipo: DADO, fuente: "margen intradia RTH del broker", fecha: "2026-08-17"}

