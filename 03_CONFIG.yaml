  # MEDIDO sobre la config v10 el 19-08 (8 semillas, crono, R=3000) por
  # modelo/cifras_citadas.py -> cifras_citadas.json:b_cond.  La cifra que se publicaba
  # antes (1.194 -> 946, P 24,53 %) era de la config v9.1: NO aplica aqui.
  # Ver 01_ESPECIFICACION R-2.6.

