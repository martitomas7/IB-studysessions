# =============================================================================
#  03_CONFIG.yaml  ·  LA UNICA FUENTE DE NUMEROS DEL PROYECTO
# =============================================================================
#  REGLA R2 (ver 04_GUARDARRAILES): un numero que no este en este fichero NO
#  EXISTE.  Prohibido escribir literales numericos de negocio en el codigo del
#  bot.  Si necesitas un numero que no esta aqui: PREGUNTA.  No lo estimes.
#
#  Cada entrada lleva:  valor · unidad · fuente · fecha · si es OPTIMIZADO o DADO
#     DADO      = impuesto por el proveedor, el broker o el mercado.  Inmutable.
#     SUPUESTO  = ADOPTADO, NO MEDIDO.  Es cuestionable, y el coste de que este mal esta
#                 cuantificado en la fila de estres que cita cada entrada.  La distincion
#                 con DADO importa: DADO no se discute; SUPUESTO si, y hay que medirlo.
#     OPTIMIZADO= elegido por el barrido con protocolo pre-registrado.  Cambiarlo
#                 invalida la cifra objetivo: no se toca sin re-optimizar.
#     DERIVADO  = se calcula de otros.  NO se escribe a mano: se computa y se
#                 comprueba contra el valor de aqui con assert.
#
#  version_config: v10
#  congelado: 2026-08-19
#  motor de referencia: modelo/pipeline3.py  (config V10 en modelo/estres_v10.py:13)
# =============================================================================

meta:
  version: "v10"
  fecha_congelacion: "2026-08-19"
  # Fuente unica de las tres: modelo/estres_v10.json -> filas.base  (8 semillas x 3000 replicas,
  # escenario cronologico).  NO usar las de modelo_v10.json:esc.crono, que son de UNA semilla.
  cifra_objetivo_usd_mes:    1198.50   # jmes medio   (sd 3.66)
  p5_objetivo_usd_mes:        797.20   # p5 medio
  p_degradar_objetivo_pct:      1.096  # P(degradar) media en %  (sd 0.32)
  semillas: 8
  replicas: 3000
  # AVISO: estas cifras son del MODELO, no una promesa. El bot debe REPRODUCIR el
  # comportamiento, no la cifra: la cifra es una media sobre 8 semillas x 3000 replicas.
  # Y el bot real rendira POR DEBAJO: hay pasos manuales que el modelo supone instantaneos
  # (norma R-4.7) y una ejecucion que el modelo supone perfecta salvo el deslizamiento.

# -----------------------------------------------------------------------------
# 1. DIVISA Y CAPITAL
# -----------------------------------------------------------------------------
capital:
  fx_eur_usd:      {valor: 1.15738,   unidad: USD/EUR, tipo: DADO,     fuente: "tipo de cambio congelado del proyecto", fecha: "2026-08-17"}
  capital_eur:     {valor: 5300.0,    unidad: EUR,     tipo: DADO,     fuente: "capital aportado por el operador",      fecha: "2026-08-17"}
  capital_usd:     {valor: 6134.114,  unidad: USD,     tipo: DERIVADO, formula: "capital_eur * fx_eur_usd"}

# REVISION_REV5.md §3 (20-08-2026): "la tesorería es por circuito... cinco procesos independientes,
# cada uno leyendo el mismo capital_usd, cada uno se creería dueño de todo el colchón" -- el bloqueo
# real antes de multicuenta no es la estructura de cuentas (config.cargar(ruta)/estado.cargar(ruta)
# YA son parametrizables por ruta, un circuito nuevo es "otro proceso con otro fichero de config y
# otro estado.json", no reescribir el nucleo), es que tesoreria.py::muro_dinamico() leia
# capital.capital_usd -- que suena (y, sin este cambio, ES) el capital GLOBAL, cuando en realidad es
# el capital de ESTE circuito. Con un segundo circuito compartiendo el mismo capital.capital_usd
# (p.ej. por un descuido al copiar el fichero de config), los dos permitirian el drawdown completo
# y juntos podrian perder el doble de lo que el modelo cree que esta en riesgo -- la degradacion se
# declararia tarde, o no se declararia. `circuito.capital_usd` es el campo que tesoreria.py debe leer
# -- HOY es el mismo numero que capital.capital_usd (solo hay un circuito), pero es un campo
# DISTINTO, con su propia identidad, para que un segundo circuito (con su PROPIO 03_CONFIG.yaml)
# tenga necesariamente su PROPIO capital_usd aqui, nunca el ajeno por descuido.
circuito:
  id:          {valor: "MFF-builder50k-1", unidad: "-", tipo: DADO,
                fuente: "identificador de ESTE circuito -- el primero, MyFundedFutures Builder 50K. Un segundo circuito (Topstep, REVISION_REV5.md §3 punto 3, no antes de F3.1 + unos meses de MFF) tendria su propio id, en su propio fichero de config.",
                fecha: "2026-08-20"}
  capital_usd: {valor: 6134.114, unidad: USD, tipo: DERIVADO, formula: "capital.capital_usd",
                fuente: "mismo capital que capital.capital_usd MIENTRAS solo haya un circuito -- ver nota de arriba. tesoreria.py::muro_dinamico() lee ESTE campo, no capital.capital_usd directo.",
                fecha: "2026-08-20"}

